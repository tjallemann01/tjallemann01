<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-label="cover-dynamic.svg"><style>
 .bg{fill:#081326}.panel{fill:#0e2340;stroke:#28608a;stroke-width:1.5}.ink{fill:#eaf7ff;font-family:Arial,Helvetica,sans-serif}.dim{fill:#96b4d1;font-family:Arial,Helvetica,sans-serif}.accent{fill:#42d9e8}.line{fill:none;stroke:#269db8;stroke-width:2}.glow{filter:url(#glow)}
 .blink{animation:blink 2.7s ease-in-out infinite}.dash{stroke-dasharray:8 15;animation:travel 7s linear infinite}.float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.trace{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4s ease-in-out forwards}
