<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="208" viewBox="0 0 1100 208" role="img" aria-label="battlebot-card.svg"><style>
 .bg{fill:#081326}.panel{fill:#0e2340;stroke:#28608a;stroke-width:1.5}.ink{fill:#eaf7ff;font-family:Arial,Helvetica,sans-serif}.dim{fill:#96b4d1;font-family:Arial,Helvetica,sans-serif}.accent{fill:#42d9e8}.line{fill:none;stroke:#269db8;stroke-width:2}.glow{filter:url(#glow)}
 .blink{animation:blink 2.7s ease-in-out infinite}.dash{stroke-dasharray:8 15;animation:travel 7s linear infinite}.float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.trace{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4s ease-in-out forwards}
 @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@keyframes travel{to{stroke-dashoffset:-230}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.93)}50%{opacity:1;transform:scale(1.08)}}@keyframes draw{to{stroke-dashoffset:0}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="bggrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1026"/><stop offset=".55" stop-color="#103154"/><stop offset="1" stop-color="#061324"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#40d7e9"/><stop offset="1" stop-color="#4c86f7"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="208" rx="18" fill="url(#bggrad)"/><rect x="18" y="18" width="1064" height="172" rx="12" fill="none" stroke="#235d7a"/><path class="line dash" d="M700 160 H810 V70 H1050"/><text x="54" y="57" class="dim" font-size="18" letter-spacing="2">03 / EMBEDDED ROBOTICS</text><text x="53" y="113" class="ink" font-weight="bold" font-size="38">BATTLEBOT P_5</text><text x="54" y="147" class="dim" font-size="17">RC / IBUS  •  JETSON  •  YOLO  •  DUAL VESC</text><text x="54" y="176" font-size="14" fill="#46dfef">MANUAL / AI / FAILSAFE</text><g class="float"><circle cx="954" cy="91" r="47" fill="none" stroke="#36bbd2" stroke-width="2"/><circle class="pulse" cx="954" cy="91" r="25" fill="#164768" stroke="#82eeed"/><path d="M922 91 H986 M954 59 V123" stroke="#91fbff" stroke-width="2"/></g></svg>